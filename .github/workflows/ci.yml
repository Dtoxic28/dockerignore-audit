name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-go@v6
        if: matrix.node == 24
        with:
          go-version: '1.27.1'
          cache-dependency-path: test/fixtures/matcher-oracle/go.sum
      - run: npm run test:oracle
        if: matrix.node == 24

  docker-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: docker/setup-buildx-action@v4
      - run: npm ci
      - run: npm run test:docker
        env:
          DOCKERIGNORE_AUDIT_DOCKER_TEST_REQUIRED: "1"
